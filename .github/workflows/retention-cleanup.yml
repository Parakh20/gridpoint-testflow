name: Retention Cleanup

# Nightly hard-delete of >90-day soft-deleted rows and archival of
# >180-day audit_logs rows. See
# supabase/migrations/20260822000012_retention_rpcs.sql and
# supabase/functions/retention-cleanup.
#
# Required GitHub Actions secrets:
#   SUPABASE_URL               already set for reconcile-cancellations.yml
#   RECONCILE_CRON_SECRET      shared with reconcile-cancellations (same
#                              Edge Function secret, reused as the cron gate)

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets
        id: check
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          SECRET: ${{ secrets.RECONCILE_CRON_SECRET }}
        run: |
          if [ -z "${URL}" ] || [ -z "${SECRET}" ]; then
            echo "Missing SUPABASE_URL or RECONCILE_CRON_SECRET — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Call retention-cleanup
        if: steps.check.outputs.skip == 'false'
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          SECRET: ${{ secrets.RECONCILE_CRON_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w "\n%{http_code}" -X POST "${URL}/functions/v1/retention-cleanup" \
            -H "X-Cron-Secret: ${SECRET}")
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "$body"
          if [ "$status" -ge 300 ]; then
            echo "retention-cleanup returned HTTP $status"
            exit 1
          fi
