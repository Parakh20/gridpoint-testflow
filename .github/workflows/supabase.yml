name: Supabase — Migrate & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase.yml'

jobs:
  # ── Billing/webhook integration tests (Deno, live local stack) ──────────────
  test-billing-functions:
    name: Test billing & webhook Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned: `latest` resolves via the unauthenticated GitHub API and
          # fails the whole job when the runner hits the rate limit.
          version: 2.116.0

      - name: Write local-only test secrets
        # Written to both locations: `supabase/.env` is the documented
        # convention, but empirically (verified via a real CI trial run,
        # branch test/ci-migration-fix, 2026-08-22) the local edge-runtime
        # started by `supabase start` only picked up custom function secrets
        # from `supabase/functions/.env` -- without it, both
        # razorpay-webhook saw its secrets as
        # unset and failed every test (500/401 instead of the expected
        # status). Keep both until this CLI behavior is better understood.
        run: |
          cat > supabase/.env <<'EOF'
          RAZORPAY_WEBHOOK_SECRET=test-secret
          RECONCILE_CRON_SECRET=test-cron-secret
          EOF
          cp supabase/.env supabase/functions/.env

      - name: Split migration 20260411000005 for from-scratch replay only
        # Every local full-migration-replay mechanism this CLI offers
        # (`start`'s auto-apply, `migration up --local`, `db push --local`)
        # applies each *.sql file as one implicit transaction (confirmed
        # empirically -- all three failed identically in the CI trial run
        # above before this step existed). Migration 20260411000005 does
        # `ALTER TYPE equipment_type ADD VALUE 'VT'` then uses 'VT' in an
        # INSERT in that SAME file, which Postgres forbids within one
        # transaction (SQLSTATE 55P04) -- this only surfaces on a
        # from-scratch replay (this job's `supabase start`), never on
        # production's already-migrated database. Migrations are
        # forward-only (docs/dev/MIGRATIONS.md) so that historical file
        # can't be edited in git history. This step splits it on the CI
        # runner's ephemeral checkout ONLY (never committed, never pushed):
        # the ALTER TYPE line stays in the original file, everything after
        # it moves to a new file timestamped to sort immediately after (and
        # before the next real migration, 20260412000001), so the enum
        # value commits in its own transaction before anything uses it.
        run: |
          set -euo pipefail
          SRC=supabase/migrations/20260411000005_add_vt_equipment_type_and_templates.sql
          SPLIT_LINE=$(grep -n "^ALTER TYPE equipment_type ADD VALUE IF NOT EXISTS 'VT';$" "$SRC" | cut -d: -f1)
          if [ -z "$SPLIT_LINE" ]; then
            echo "::error::Expected ALTER TYPE line not found in $SRC -- migration content may have drifted, update this split step"
            exit 1
          fi
          DEST=supabase/migrations/20260411000006_add_vt_equipment_type_and_templates_inserts.sql
          tail -n +"$((SPLIT_LINE + 1))" "$SRC" > "$DEST"
          head -n "$SPLIT_LINE" "$SRC" > "$SRC.tmp" && mv "$SRC.tmp" "$SRC"
          echo "Split $SRC at line $SPLIT_LINE -> $DEST ($(wc -l < "$DEST") lines)"

      - name: Start local Supabase stack
        run: supabase start

      - name: Run Deno integration tests
        working-directory: supabase/functions
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          RAZORPAY_WEBHOOK_SECRET: test-secret
          RECONCILE_CRON_SECRET: test-cron-secret
        run: |
          set -euo pipefail
          SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ "$SUPABASE_SERVICE_ROLE_KEY" = "null" ]; then
            echo "::error::Failed to extract SUPABASE_SERVICE_ROLE_KEY from 'supabase status -o json' (empty or literal \"null\" — check the .SERVICE_ROLE_KEY JSON path is still correct)"
            exit 1
          fi
          export SUPABASE_SERVICE_ROLE_KEY
          deno test --allow-net --allow-env \
            _shared/entitlements.test.ts \
            _shared/billing_provider.test.ts \
            _shared/billing_provider_invoices.test.ts \
            _shared/svix.test.ts \
            _shared/email_templates.test.ts \
            _shared/billing_provider_orders.test.ts \
            razorpay-webhook/index.test.ts

      - name: Stop local Supabase stack
        if: always()
        # Cleanup only -- never fail the job on teardown (e.g. the stack never
        # started because CLI setup failed).
        run: supabase stop || true

  # ── Edge functions deploy (runs AFTER migrations so schema is up to date) ────
  # test-billing-functions gates this deploy again as of 2026-08-22: the
  # from-scratch-replay bug (see that job's "Split migration..." step) and
  # the local-secrets gap (see "Write local-only test secrets") are both
  # fixed and verified via a real CI trial run (branch
  # test/ci-migration-fix, 9/9 tests passing).
  deploy-functions:
    name: Deploy edge functions
    needs: [run-migrations, test-billing-functions]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check required secrets
        id: secret_check
        shell: bash
        run: |
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "$PROJECT_ID" ] || missing+=("SUPABASE_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Missing secrets: ${missing[*]} - skipping function deploy"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Supabase CLI
        if: steps.secret_check.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          # Pinned: `latest` resolves via the unauthenticated GitHub API and
          # fails the whole job when the runner hits the rate limit.
          version: 2.116.0

      - name: Deploy edge functions
        if: steps.secret_check.outputs.ready == 'true'
        run: |
          for fn in supabase/functions/*/; do
            [ -d "$fn" ] || continue
            name="$(basename "$fn")"
            [ "$name" = "_shared" ] && continue
            echo "Deploying $name"
            supabase functions deploy "$name" \
              --project-ref "$PROJECT_ID" \
              --no-verify-jwt \
              --use-api
          done

  # ── Database migrations (also needs DB password) ────────────────────────────
  run-migrations:
    name: Apply database migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check required secrets
        id: secret_check
        shell: bash
        run: |
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "$PROJECT_ID" ] || missing+=("SUPABASE_PROJECT_ID")
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing+=("SUPABASE_DB_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Missing secrets: ${missing[*]} - skipping migrations"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Supabase CLI
        if: steps.secret_check.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          # Pinned: `latest` resolves via the unauthenticated GitHub API and
          # fails the whole job when the runner hits the rate limit.
          version: 2.116.0

      - name: Link Supabase project
        if: steps.secret_check.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Repair phantom migration history entry (one-time, self-healing)
        # A 2026-08-22 push collision left a phantom schema_migrations row
        # for version 20260822000004 with no matching local file anymore
        # (renumbered to 20260822000008/000009 after discovering the real
        # functions were never created despite the bookkeeping row existing
        # -- see commit 3a57bc7). `db push` refuses to proceed while a
        # remote version has no local file. This repair is idempotent
        # (`|| true`): once the remote entry is marked reverted, later runs
        # find nothing to repair and this step is a harmless no-op forever.
        if: steps.secret_check.outputs.ready == 'true'
        run: supabase migration repair --status reverted 20260822000004 || true

      - name: Apply database migrations
        if: steps.secret_check.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
