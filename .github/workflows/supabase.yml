name: Supabase — Migrate & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase.yml'

jobs:
  deploy:
    name: Apply migrations & deploy edge functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required Supabase secrets
        id: secret_check
        shell: bash
        run: |
          missing=()

          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "$PROJECT_ID" ] || missing+=("SUPABASE_PROJECT_ID")
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing+=("SUPABASE_DB_PASSWORD")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Missing required GitHub Actions secrets: ${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip deploy when secrets are missing
        if: ${{ steps.secret_check.outputs.ready != 'true' }}
        run: |
          echo "Skipping Supabase deploy because required secrets are not configured."
          exit 0

      - name: Set up Supabase CLI
        if: ${{ steps.secret_check.outputs.ready == 'true' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        if: ${{ steps.secret_check.outputs.ready == 'true' }}
        run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        if: ${{ steps.secret_check.outputs.ready == 'true' }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy edge functions
        if: ${{ steps.secret_check.outputs.ready == 'true' }}
        run: |
          for fn in supabase/functions/*; do
            [ -d "$fn" ] || continue
            supabase functions deploy "$(basename "$fn")" \
              --project-ref "$PROJECT_ID" \
              --no-verify-jwt \
              --use-api
          done
