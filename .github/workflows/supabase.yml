name: Supabase — Migrate & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase.yml'

jobs:
  # ── Billing/webhook integration tests (Deno, live local stack) ──────────────
  test-billing-functions:
    name: Test billing & webhook Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Write local-only test secrets
        run: |
          cat > supabase/.env <<'EOF'
          RAZORPAY_WEBHOOK_SECRET=test-secret
          RECONCILE_CRON_SECRET=test-cron-secret
          EOF

      - name: Start local Supabase stack
        run: supabase start

      - name: Run Deno integration tests
        working-directory: supabase/functions
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          RAZORPAY_WEBHOOK_SECRET: test-secret
          RECONCILE_CRON_SECRET: test-cron-secret
        run: |
          set -euo pipefail
          SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ "$SUPABASE_SERVICE_ROLE_KEY" = "null" ]; then
            echo "::error::Failed to extract SUPABASE_SERVICE_ROLE_KEY from 'supabase status -o json' (empty or literal \"null\" — check the .SERVICE_ROLE_KEY JSON path is still correct)"
            exit 1
          fi
          export SUPABASE_SERVICE_ROLE_KEY
          deno test --allow-net --allow-env \
            _shared/entitlements.test.ts \
            razorpay-webhook/index.test.ts \
            reconcile-cancellations/index.test.ts

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  # ── Edge functions deploy (runs AFTER migrations so schema is up to date) ────
  deploy-functions:
    name: Deploy edge functions
    needs: [run-migrations, test-billing-functions]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check required secrets
        id: secret_check
        shell: bash
        run: |
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "$PROJECT_ID" ] || missing+=("SUPABASE_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Missing secrets: ${missing[*]} - skipping function deploy"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Supabase CLI
        if: steps.secret_check.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        if: steps.secret_check.outputs.ready == 'true'
        run: |
          for fn in supabase/functions/*/; do
            [ -d "$fn" ] || continue
            name="$(basename "$fn")"
            [ "$name" = "_shared" ] && continue
            echo "Deploying $name"
            supabase functions deploy "$name" \
              --project-ref "$PROJECT_ID" \
              --no-verify-jwt \
              --use-api
          done

  # ── Database migrations (also needs DB password) ────────────────────────────
  run-migrations:
    name: Apply database migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check required secrets
        id: secret_check
        shell: bash
        run: |
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "$PROJECT_ID" ] || missing+=("SUPABASE_PROJECT_ID")
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing+=("SUPABASE_DB_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Missing secrets: ${missing[*]} - skipping migrations"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Supabase CLI
        if: steps.secret_check.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        if: steps.secret_check.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        if: steps.secret_check.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
