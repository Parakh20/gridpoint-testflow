name: Verify Custom Domains

# Sweeps every custom domain that isn't provisioned yet: re-checks the
# tenant's DNS TXT record, then registers verified hostnames with Vercel so
# TLS is issued. See supabase/functions/verify-custom-domain.
#
# Hourly rather than daily: a customer who has just published their DNS
# records is actively waiting for the domain to go live, and a 24-hour wait
# would make the feature feel broken. The sweep is a no-op when nothing is
# pending.
#
# Required GitHub Actions secrets:
#   SUPABASE_URL             already set for the sibling cron workflows
#   RECONCILE_CRON_SECRET    shared cron gate, must match the Supabase secret
#
# Provisioning additionally needs VERCEL_API_TOKEN + VERCEL_PROJECT_ID set as
# Supabase Edge Function secrets. Without them a domain still verifies and
# waits in "awaiting activation" for an operator to run
# `vercel domains add <domain> gridpoint-testflow`.

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets
        id: check
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          SECRET: ${{ secrets.RECONCILE_CRON_SECRET }}
        run: |
          if [ -z "${URL}" ] || [ -z "${SECRET}" ]; then
            echo "Missing SUPABASE_URL or RECONCILE_CRON_SECRET — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Call verify-custom-domain
        if: steps.check.outputs.skip == 'false'
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          SECRET: ${{ secrets.RECONCILE_CRON_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w "\n%{http_code}" -X POST "${URL}/functions/v1/verify-custom-domain" \
            -H "X-Cron-Secret: ${SECRET}")
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "$body"
          if [ "$status" -ge 300 ]; then
            echo "verify-custom-domain returned HTTP $status"
            exit 1
          fi
