name: Notify Renewal

# Periodic drain of the renewal_notifications outbox — see
# supabase/migrations/20260827000004_prepaid_periods_and_freeze.sql and
# supabase/functions/notify-renewal.
#
# Required GitHub Actions secrets:
#   SUPABASE_URL               already set for reconcile-cancellations.yml
#   RECONCILE_CRON_SECRET      shared with reconcile-cancellations (same
#                              Edge Function secret, reused as the cron gate)
#   Requires RESEND_API_KEY to also be set as a Supabase Edge Function
#   secret (`supabase secrets set RESEND_API_KEY=...`) — already used by
#   notify-demo-request.

# Daily, not every 15 minutes: reminders are milestone-based (7/3/1/0 days
# out) and the UNIQUE constraint on the outbox means a second run the same day
# sends nothing. 04:00 UTC is 09:30 IST — a working-hours arrival for Indian
# customers rather than the middle of the night.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets
        id: check
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          SECRET: ${{ secrets.RECONCILE_CRON_SECRET }}
        run: |
          if [ -z "${URL}" ] || [ -z "${SECRET}" ]; then
            echo "Missing SUPABASE_URL or RECONCILE_CRON_SECRET — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Call notify-renewal
        if: steps.check.outputs.skip == 'false'
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          SECRET: ${{ secrets.RECONCILE_CRON_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w "\n%{http_code}" -X POST "${URL}/functions/v1/notify-renewal" \
            -H "X-Cron-Secret: ${SECRET}")
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "$body"
          if [ "$status" -ge 300 ]; then
            echo "notify-renewal returned HTTP $status"
            exit 1
          fi
