name: Reconcile Expired Cancellations

# Daily backstop: flip any subscription whose cancel_at has passed to
# 'cancelled', independent of whether Razorpay ever sends a confirming
# webhook. See docs/dev/BILLING_QA_MATRIX.md scenario 6 and
# supabase/functions/reconcile-cancellations.
#
# Required GitHub Actions secrets:
#   SUPABASE_URL               already set for backup.yml's sibling workflows
#   RECONCILE_CRON_SECRET      must match the Edge Function secret of the
#                              same name (`supabase secrets set RECONCILE_CRON_SECRET=...`)

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets
        id: check
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          SECRET: ${{ secrets.RECONCILE_CRON_SECRET }}
        run: |
          if [ -z "${URL}" ] || [ -z "${SECRET}" ]; then
            echo "Missing SUPABASE_URL or RECONCILE_CRON_SECRET — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Call reconcile-cancellations
        if: steps.check.outputs.skip == 'false'
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          SECRET: ${{ secrets.RECONCILE_CRON_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w "\n%{http_code}" -X POST "${URL}/functions/v1/reconcile-cancellations" \
            -H "X-Cron-Secret: ${SECRET}")
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "$body"
          if [ "$status" -ge 300 ]; then
            echo "reconcile-cancellations returned HTTP $status"
            exit 1
          fi
