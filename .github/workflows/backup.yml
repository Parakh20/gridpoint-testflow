name: Database Backup

# Nightly backup using the Supabase CLI (supabase db dump).
# The CLI handles connection routing internally — no IPv4/IPv6 issues.
# Primary destination: GitHub Actions artifact (30-day retention, free).
#
# Required GitHub Actions secrets:
#   SUPABASE_ACCESS_TOKEN   from supabase.com → Account → Access Tokens
#   SUPABASE_PROJECT_ID     hxfilijpaocogsgjrjnq
#   SUPABASE_DB_PASSWORD    from Supabase Dashboard → Settings → Database
#
# Optional secrets for longer-lived S3 backups:
#   BACKUP_S3_ENDPOINT           e.g. https://<account>.r2.cloudflarestorage.com
#   BACKUP_S3_BUCKET             bucket name
#   BACKUP_S3_ACCESS_KEY_ID
#   BACKUP_S3_SECRET_ACCESS_KEY
#   BACKUP_S3_REGION             e.g. auto for R2, us-east-1 for AWS

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check secrets
        id: check
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=()
          [ -n "${SUPABASE_ACCESS_TOKEN}" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "${PROJECT_ID}" ]            || missing+=("SUPABASE_PROJECT_ID")
          [ -n "${DB_PASSWORD}" ]           || missing+=("SUPABASE_DB_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing secrets: ${missing[*]} — skipping backup."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Supabase CLI
        if: steps.check.outputs.skip == 'false'
        uses: supabase/setup-cli@v1
        with:
          # Pinned: `latest` resolves via the unauthenticated GitHub API and
          # fails the whole job when the runner hits the rate limit.
          version: 2.116.0

      - name: Link Supabase project
        if: steps.check.outputs.skip == 'false'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${PROJECT_ID}" --password "${SUPABASE_DB_PASSWORD}"

      - name: Dump database
        if: steps.check.outputs.skip == 'false'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          FILE="testflow-${STAMP}.sql"
          echo "FILE=${FILE}.gz" >> "$GITHUB_ENV"
          supabase db dump --linked --password "${SUPABASE_DB_PASSWORD}" -f "${FILE}"
          gzip -9 "${FILE}"
          ls -lh "${FILE}.gz"

      - name: Upload as GitHub Actions artifact
        if: steps.check.outputs.skip == 'false' && env.FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30

      - name: Upload to S3-compatible storage (optional)
        if: steps.check.outputs.skip == 'false' && env.FILE != ''
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ secrets.BACKUP_S3_REGION }}
          S3_ENDPOINT:           ${{ secrets.BACKUP_S3_ENDPOINT }}
          S3_BUCKET:             ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${S3_BUCKET:-}" ] || [ -z "${S3_ENDPOINT:-}" ]; then
            echo "S3 secrets not set — skipping S3 upload. Artifact above is the backup."
            exit 0
          fi
          pip install awscli --quiet
          aws s3 cp "${FILE}" "s3://${S3_BUCKET}/${FILE}" --endpoint-url "${S3_ENDPOINT}"
          echo "Uploaded to S3: s3://${S3_BUCKET}/${FILE}"
